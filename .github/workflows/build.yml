name: Build

on:
  push:
    branches: [ main ]

jobs:
  build:

    runs-on: ${{ matrix.os-type }}

    strategy:
      matrix:
        node-version: [20.x, 21.x, 22.x]
        os-type: [windows-latest, macos-latest, ubuntu-latest]

    steps:
    - uses: actions/checkout@v3
    - uses: actions/setup-node@v2
      with:
        node-version: ${{ matrix.node-version }}
    - run: npm install
    - run: npm run dist
